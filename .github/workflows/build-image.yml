name: Build Art-Cleaner image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "start.sh"
      - "requirements.txt"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/lordmarrik/art-cleaner-runpod:latest
            ghcr.io/lordmarrik/art-cleaner-runpod:${{ github.sha }}

      - name: Smoke test (app imports inside the image)
        run: docker run --rm ghcr.io/lordmarrik/art-cleaner-runpod:latest python -c "import app.main; print('app imports ok')"
